name: Run Custom Checkov Policies
description: Runs Custom Checkov Policies on SAM/CloudFormation templates

inputs:
  framework:
    description: The framework of the templates to scan
    required: false
    default: cloudformation
  pull-repository:
    description: Whether to checkout the calling repository before scanning
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Pull repository
      if: ${{ inputs.pull-repository == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: '0'

    - name: Fetch main
      shell: bash
      run: git fetch origin main --depth=1

    - name: Get changed files
      id: changed-files
      shell: bash
      run: ${{ github.action_path }}/../../.github/scripts/get-changed-files.sh

    - name: Setup Python
      if: ${{ steps.changed-files.outputs.changed == 'true' }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12' # This is the latest version of Python supported by Checkov

    - name: Install Checkov
      if: ${{ steps.changed-files.outputs.changed == 'true' }}
      shell: bash
      run: pip install checkov

    - name: Run Checkov
      if: ${{ steps.changed-files.outputs.changed == 'true' }}
      shell: bash
      run: |
        checkov ${{ steps.changed-files.outputs.file-args }} \
          --framework ${{ inputs.framework }} \
          --external-checks-dir ${{ github.action_path }}/../../src/checks/ \
          --output cli \
          --output sarif \
          --output-file-path console,results-${{ github.run_id }}.sarif

    - name: Upload SARIF results
      if: ${{ steps.changed-files.outputs.changed == 'true' && (success() || failure()) }}
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: results-${{ github.run_id }}.sarif
        category: infrastructure-compliance-checks
