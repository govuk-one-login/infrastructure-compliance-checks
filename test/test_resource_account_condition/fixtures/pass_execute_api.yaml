AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PASS: execute-api:Invoke against wildcard-account ARN with aws:ResourceAccount condition.
Parameters:
  AccessCrossAccountAPI:
    Type: String
Resources:
  ExecuteApiPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - execute-api:Invoke
            Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:*:*"
            Condition:
              ForAnyValue:StringEquals:
                aws:ResourceAccount: !Ref AccessCrossAccountAPI
