AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FAIL: DynamoDB actions against wildcard-account ARN without aws:ResourceAccount condition.
Resources:
  DynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource: !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:*:table/*"
