AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FAIL: SQS actions against wildcard-account ARN without aws:ResourceAccount condition.
Resources:
  SQSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:*:*"
