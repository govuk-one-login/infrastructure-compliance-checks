AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PASS: SQS actions against wildcard-account ARN with aws:ResourceAccount condition.
Parameters:
  AccessCrossAccountSQS:
    Type: String
Resources:
  SQSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:*:*"
            Condition:
              ForAnyValue:StringEquals:
                aws:ResourceAccount: !Ref AccessCrossAccountSQS
