AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  FAIL: execute-api:Invoke against wildcard-account ARN without aws:ResourceAccount condition.
Resources:
  ExecuteApiPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - execute-api:Invoke
            Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:*:*"
