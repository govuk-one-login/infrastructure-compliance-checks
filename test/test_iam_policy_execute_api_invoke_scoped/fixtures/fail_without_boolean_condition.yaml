AWSTemplateFormatVersion: "2010-09-09"
Resources:
  FailPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - execute-api:Invoke
            Resource: "*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref AWSOrganizationId
