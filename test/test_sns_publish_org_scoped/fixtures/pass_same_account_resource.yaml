AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PASS: application role grants sns:Publish scoped to own account via
  AWS::AccountId - same account implies same org, no aws:PrincipalOrgID required.
Resources:
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sns-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sns:Publish"
                Resource:
                  - !Sub "arn:aws:sns:eu-west-2:${AWS::AccountId}:*"
