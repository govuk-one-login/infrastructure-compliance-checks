AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PASS: application role grants sns:Publish with Resource "*" to support
  Cognito User Pool. Exempt from aws:PrincipalOrgID requirement.
Resources:
  CognitoSMSRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cognito-sns-publish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sns:Publish"
                Resource:
                  - "*"
